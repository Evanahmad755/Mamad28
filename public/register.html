<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pasang Password UCP — Indonation Roleplay</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div>
    <div class="logo-wrap">
      <img src="/assets/logo.gif" alt="Indonation Roleplay" />
      <div class="tagline">Indonation Roleplay</div>
    </div>

    <div class="card">
      <h1>Pasang Password</h1>
      <p class="sub">Buat akun UCP yang sudah dibuat lewat Discord</p>

      <p class="switch" style="margin-top:0; text-align:left;">
        Belum bikin akun? Buat dulu lewat bot di
        <a href="https://discord.gg/x3yERrtHFF" target="_blank" rel="noopener">Discord Indonation Roleplay</a>,
        lalu ambil kode verifikasinya dari sana.
      </p>

      <form id="registerForm">
        <label for="ucp">Username UCP</label>
        <input id="ucp" name="ucp" autocomplete="username" required />

        <label for="verifycode">Kode verifikasi dari Discord</label>
        <input id="verifycode" name="verifycode" inputmode="numeric" required />

        <label for="password">Password baru</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="32" />
          <button type="button" class="pw-eye" data-target="password"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>

        <button type="submit">Pasang Password</button>
        <p id="msg" class="msg"></p>
      </form>

      <p class="switch">Sudah punya password? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>

  <script>
    const EYE_ICON = `<svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_OFF_ICON = `<svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.7 15.7 0 0 1-3.3 4.3M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7c1.4 0 2.6-.3 3.7-.8"/><path d="M9.5 9.8a3 3 0 0 0 4.2 4.2"/></svg>`;
    document.querySelectorAll('.pw-eye').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.innerHTML = input.type === 'password' ? EYE_ICON : EYE_OFF_ICON;
      });
    });

    const API_BASE = '';
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';
      const button = form.querySelector('button');
      button.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ucp: form.ucp.value.trim(),
            password: form.password.value,
            verifycode: form.verifycode.value.trim(),
          }),
        });
        const data = await res.json();

        if (!data.ok) {
          msg.textContent = data.message || 'Gagal memasang password.';
          msg.classList.add('error');
          return;
        }

        msg.textContent = data.message + ' Mengalihkan ke halaman login...';
        msg.classList.add('ok');
        setTimeout(() => (window.location.href = 'login.html'), 1200);
      } catch (err) {
        msg.textContent = 'Tidak bisa menghubungi server. Coba lagi.';
        msg.classList.add('error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
