<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daftar Akun Baru — Indonation Roleplay</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div>
    <div class="logo-wrap">
      <img src="/assets/logo.gif" alt="Indonation Roleplay" />
      <div class="tagline">Indonation Roleplay</div>
    </div>

    <div class="card">
      <h1>Daftar Akun Baru</h1>
      <p class="sub" id="cardSub">Verifikasi Discord dulu, satu Discord cuma boleh punya satu akun UCP.</p>

      <div id="step1">
        <button id="discordBtn" class="discord-btn">Login pakai Discord</button>
        <p id="msg" class="msg"></p>
      </div>

      <form id="registerForm" style="display:none;">
        <p class="sub" style="margin:0 0 6px;">Login Discord sebagai <b id="discordName"></b> — terverifikasi <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></p>
        <label for="ucp">Pilih Username UCP</label>
        <input id="ucp" name="ucp" autocomplete="username" required />

        <label for="password">Buat Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="32" />
          <button type="button" class="pw-eye" data-target="password"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>

        <button type="submit">Buat Akun</button>
        <p id="formMsg" class="msg"></p>
      </form>

      <p class="switch">Udah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>

  <script>
    const EYE_ICON = `<svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_OFF_ICON = `<svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.7 15.7 0 0 1-3.3 4.3M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7c1.4 0 2.6-.3 3.7-.8"/><path d="M9.5 9.8a3 3 0 0 0 4.2 4.2"/></svg>`;
    document.querySelectorAll('.pw-eye').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.innerHTML = input.type === 'password' ? EYE_ICON : EYE_OFF_ICON;
      });
    });

    document.getElementById('discordBtn').addEventListener('click', () => {
      window.location.href = '/auth/discord/start';
    });

    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById('msg');
    const error = params.get('error');
    const vtoken = params.get('vtoken');
    const discordName = params.get('discordName');

    if (error) {
      msg.textContent = error;
      msg.classList.add('error');
    }

    if (vtoken) {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('discordName').textContent = discordName || 'Discord';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formMsg = document.getElementById('formMsg');
      formMsg.textContent = ''; formMsg.className = 'msg';
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;

      try {
        const res = await fetch('/api/register-new', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vtoken, ucp: form.ucp.value.trim(), password: form.password.value }),
        });
        const data = await res.json();
        if (!data.ok) {
          formMsg.textContent = data.message || 'Gagal bikin akun.';
          formMsg.classList.add('error');
          return;
        }
        formMsg.textContent = data.message + ' Mengalihkan ke halaman login...';
        formMsg.classList.add('ok');
        setTimeout(() => (window.location.href = 'login.html'), 1200);
      } catch (err) {
        formMsg.textContent = 'Tidak bisa menghubungi server. Coba lagi.';
        formMsg.classList.add('error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
